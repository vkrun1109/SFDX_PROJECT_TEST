name: Salesforce + Vlocity Deployment

on:
  push:
    branches:
      - main
      - release/*
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Dev

    steps:

    # =====================================
    # 1️⃣ Checkout Code
    # =====================================
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0   # ✅ Required for delta comparison

    # =====================================
    # 2️⃣ Setup Node.js
    # =====================================
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    # =====================================
    # 3️⃣ Install CLIs
    # =====================================
    - name: Install Salesforce CLI
      run: npm install -g @salesforce/cli

    - name: Install Vlocity CLI + Plugin
      run: |
        npm install -g vlocity
        sf plugins install vlocityestools || true

    # =====================================
    # 4️⃣ Authenticate Salesforce (JWT)
    # =====================================
    - name: Authenticate Salesforce Org
      env:
       SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
       SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
       SF_USERNAME: ${{ secrets.SF_USERNAME }}
       SF_INSTANCE_URL: ${{ secrets.SF_INSTANCE_URL }}
      run: |
        echo "Writing JWT Key..."
        printf "%s" "$SF_JWT_KEY" > server.key
        echo "validating Key format..."
        head -1 server.key
        tail -1 server.key
        sf org login jwt \
          --client-id ${{ secrets.SF_CLIENT_ID }} \
          --username ${{ secrets.SF_USERNAME }} \
          --jwt-key-file server.key \
          --instance-url ${{ secrets.SF_INSTANCE_URL }} \
          --alias targetOrg

    # =====================================
    # 5️⃣ GET DELTA (SF + Vlocity)
    # =====================================
    - name: Prepare Delta
      run: |
        echo "Fetching previous commit..."
        BASE_COMMIT=$(git rev-parse HEAD~1)

        echo "Base commit: $BASE_COMMIT"

        # Salesforce delta
        sf project deploy preview \
          --source-dir force-app \
          --target-org targetOrg \
          --json > delta-preview.json || true

        # Create delta folder
        mkdir -p delta

        echo "Generating Salesforce delta package..."
        git diff $BASE_COMMIT HEAD --name-only force-app > delta/sf_delta.txt

        if [ -s delta/sf_delta.txt ]; then
          echo "Salesforce delta found"
        else
          echo "No Salesforce changes"
        fi

        # Vlocity delta
        git diff $BASE_COMMIT HEAD --name-only vlocity | cut -f1-3 -d'/' | sort -u > delta/vlocity_delta.txt

        if [ -s delta/vlocity_delta.txt ]; then
          echo "Vlocity delta found"
        else
          echo "No Vlocity changes"
        fi

        cat delta/*
    
    # =====================================
    # 6️⃣ VALIDATION (CHECK ONLY)
    # =====================================
